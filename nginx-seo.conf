# Nginx configuration for Vite SPA — SEO & Performance
# Place this in your nginx sites-available/ (or include in server block)

server {
    listen 80;
    server_name www.marinoatohoun.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.marinoatohoun.tech;

    root /var/www/marino-portfolio/dist;
    index index.html;

    # Brotli compression
    brotli on;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Gzip fallback
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Static assets — aggressive cache with fingerprinting
    location ~* \.(?:js|css|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML & JSON — no cache
    location ~* \.(?:html|json)$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SEO files
    location = /robots.txt {}
    location = /llms.txt {}
    location = /sitemap.xml {}
    location = /.htaccess {}
}
